apiVersion: v1
kind: Service
metadata:
  name: {{ template "armada.name" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "armada.labels" . | nindent 4 }}
  {{ with .Values.api.service.annotations }}
  annotations:
    {{ . | toYaml | nindent 4 }}
  {{ end }}
spec:
  {{- if .Values.api.service.clusterIP }}
  clusterIP: {{ .Values.api.service.clusterIP }}
  {{- end }}
  type: {{ .Values.api.service.type }}
  {{- if .Values.api.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.api.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "armada.selectorLabels" . | nindent 6 }}
  ports:
  - name: https-api
    targetPort: https
    port: {{ .Values.api.port }}
